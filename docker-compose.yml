version: '3.8'

services:
  # Python FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: vrm_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongodb:27017/vrm_db}
      - JWT_SECRET=${JWT_SECRET:-super-secret-vrm-ai-jwt-key-2026}
      - PORT=8000
    depends_on:
      - mongodb
    networks:
      - vrm-network

  # Vite React Frontend (Served via Nginx)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: vrm_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - vrm-network

  # MongoDB Database (Optional local container)
  mongodb:
    image: mongo:6.0
    container_name: vrm_mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - vrm-network

volumes:
  mongo_data:

networks:
  vrm-network:
    driver: bridge
